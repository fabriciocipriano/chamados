services:
  db:
    image: postgres:16-alpine
    container_name: chamados-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chamados
    ports:
      - "5433:5432"
    volumes:
      - chamados_pgdata:/var/lib/postgresql/data

volumes:
  chamados_pgdata:
